[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_return_any = true

[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: no Qt required",
    "widget: requires QApplication (run with QT_QPA_PLATFORM=offscreen)",
    "integration: requires full Qt application",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
title = "Project – Coverage Report"
