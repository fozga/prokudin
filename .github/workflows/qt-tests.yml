name: Qt Tests with Coverage

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'test/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qt-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system Qt dependencies
        run: sudo apt-get install -y libxkbcommon-x11-0 libgl1

      - name: Run Qt tests with coverage
        run: python3 run_tests.py --suite qt -v

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-coverage-html
          path: htmlcov-qt
